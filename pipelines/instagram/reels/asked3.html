<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:'PJS';src:url(__PJS__) format('woff2');font-weight:100 900}
@font-face{font-family:'InterV';src:url(__INTER__) format('woff2');font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07100c}
body{font-family:'InterV',-apple-system,system-ui,sans-serif;color:#fff;position:relative}
.abs{position:absolute;will-change:transform,opacity,filter}
/* photo layers: soft fill behind, sharp hero in front, both parallax */
#bg{position:absolute;inset:-80px;background:url(__PHOTO__) center/cover;filter:blur(44px) brightness(.5) saturate(1.2)}
#hero{position:absolute;left:-60px;top:0;width:1200px;height:1920px;background:url(__PHOTO__) center/cover;
  border-radius:0;transform-origin:center}
#vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,16,12,.55) 0%,rgba(7,16,12,0) 26%,rgba(7,16,12,0) 50%,rgba(7,16,12,.72) 74%,rgba(7,16,12,.92) 100%)}
#hint{position:absolute;inset:-120px;background:url(__PHOTO__) center/cover;filter:blur(34px) brightness(.42) saturate(1.25)}
#dark{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 40%,#0e1f17 0%,#07100c 70%)}
/* liquid glass: no strokes, radius everywhere, light from the top-left */
.glass{background:linear-gradient(135deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.10) 45%,rgba(255,255,255,.06) 100%);
  backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);
  border-radius:34px;box-shadow:0 22px 60px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.12)}
.chip{display:inline-flex;align-items:center;gap:16px;padding:20px 32px;border-radius:999px;font-size:34px;font-weight:500;color:rgba(255,255,255,.92)}
.card{padding:34px 40px;font-family:'PJS',system-ui,sans-serif}
.h1{font-family:'PJS';font-size:84px;font-weight:700;line-height:1.08;letter-spacing:-.025em;color:#fff}
.h2{font-family:'PJS';font-size:52px;font-weight:600;line-height:1.15;letter-spacing:-.02em;color:#fff}
.small{font-size:34px;font-weight:500;color:rgba(255,255,255,.74);line-height:1.35}
.gold{color:#F5C451}
.row{display:flex;align-items:baseline;gap:22px;font-size:48px;font-weight:500;line-height:1.35}
.row span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.row b{font-family:'PJS';font-weight:600;color:#F5C451;min-width:150px;font-variant-numeric:tabular-nums}
/* ask bar */
#bar{position:absolute;left:80px;top:760px;width:800px;padding:30px 36px;border-radius:44px;
  display:flex;align-items:center;gap:22px;overflow:hidden}
#bar .orb{width:46px;height:46px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 35%,#FBE2A0,#F5C451 55%,#c98a12);box-shadow:0 0 30px rgba(245,196,81,.55)}
#typed{font-size:42px;font-weight:500;line-height:1.28;letter-spacing:-.01em;color:#fff;word-break:break-word}
#typed .ph{color:rgba(255,255,255,.4)}
#cur{display:inline-block;width:4px;height:48px;background:#F5C451;vertical-align:-8px;margin-left:4px;border-radius:2px}
#barglow{position:absolute;left:80px;top:760px;width:800px;height:132px;border-radius:44px;
  box-shadow:0 0 0 0 rgba(245,196,81,0);pointer-events:none}
.char{width:300px;height:300px}.char img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 22px 34px rgba(0,0,0,.5))}
.mark{width:40px;height:40px;border-radius:50%;display:block}
#end{position:absolute;inset:0;background:radial-gradient(80% 55% at 50% 38%,#12301f 0%,#07100c 75%)}
#end .logo{width:150px;height:150px;border-radius:50%;display:block;margin:0 auto 34px;box-shadow:0 0 90px rgba(245,196,81,.25)}
#end .t{font-family:'PJS';font-size:70px;font-weight:700;text-align:center;letter-spacing:-.025em;line-height:1.05}
#end .s{font-family:'PJS';font-size:40px;font-weight:600;color:#F5C451;text-align:center;margin-top:26px}
#end .u{font-size:30px;font-weight:500;color:rgba(252,254,253,.6);text-align:center;margin-top:16px;letter-spacing:.06em}
.guides{position:absolute;inset:0;pointer-events:none;display:none}
.guides i{position:absolute;background:rgba(255,0,80,.18)}
.guides u{position:absolute;left:80px;right:200px;top:280px;bottom:500px;border:2px dashed rgba(0,255,160,.6)}
</style></head><body>
<div id="dark"></div><div id="hint"></div><div id="bg"></div><div id="hero"></div><div id="vig"></div>

<div id="wm" class="abs glass" style="left:784px;top:290px;width:96px;height:96px;border-radius:50%;padding:14px"><img src="__LOGO__" style="width:68px;height:68px;border-radius:50%;display:block"></div>
<div id="handle" class="abs" style="left:80px;top:1720px;font-size:28px;font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.62);text-shadow:0 2px 14px rgba(0,0,0,.7)">@elixiary.ai</div>

<div id="ask" class="abs" style="left:80px;top:330px;font-family:'PJS';font-size:58px;font-weight:700;color:#F5C451;letter-spacing:-.01em">I asked an AI for</div>
<div id="words" class="abs" style="left:80px;top:430px;width:940px;font-family:'PJS';font-size:122px;font-weight:800;line-height:1.02;letter-spacing:-.035em;color:#fff"></div>
<div id="cur" class="abs" style="width:16px;height:100px;background:#F5C451;border-radius:4px;box-shadow:0 0 34px rgba(245,196,81,.6)"></div>
<div id="think" class="abs chip glass" style="left:80px;top:1190px;font-size:44px;padding:24px 40px">Marlow is thinking<span id="dots">&hellip;</span></div>
<div id="sal" class="abs" style="left:-20px;top:1240px;width:640px;height:700px"><img src="__SAL_THINK__" style="width:100%;height:100%;object-fit:contain;object-position:left bottom;display:block;filter:drop-shadow(0 26px 40px rgba(0,0,0,.55))"></div>
<div id="bar"></div><div id="barglow"></div><div id="typed"></div>

<div id="name" class="abs" style="left:80px;top:940px;width:920px">
  <div class="chip glass" style="font-family:'PJS';font-size:40px;font-weight:600;color:#F5C451;margin-bottom:22px;padding:16px 30px">it named it that.</div>
  <div id="name_l" style="font-family:'PJS';font-size:150px;font-weight:800;line-height:.98;letter-spacing:-.04em;color:#fff;
    text-shadow:0 8px 40px rgba(0,0,0,.55)">Name</div></div>

<div id="build" class="abs card glass" style="left:80px;top:1120px;width:800px"><div class="h2 gold" style="margin-bottom:22px">the build</div><div id="rows"></div></div>

<div id="next" class="abs card glass" style="left:80px;top:1120px;max-width:800px"><div class="h1">what should I<br>ask it next?</div>
  <div class="small" style="margin-top:14px">tell me in the comments &#128071;</div></div>
<div id="m" class="abs char" style="left:600px;top:840px;width:250px;height:250px"><img id="m_img" src=""></div>
<div id="salr" class="abs" style="left:560px;top:560px;width:520px;height:520px"><img src="__SAL_SURPRISED__" style="width:100%;height:100%;object-fit:contain;object-position:right bottom;display:block;filter:drop-shadow(0 22px 34px rgba(0,0,0,.5))"></div>
<div id="salb" class="abs" style="left:590px;top:540px;width:330px;height:580px"><img src="__SAL_OFFER__" style="width:100%;height:100%;object-fit:contain;object-position:right bottom;display:block;filter:drop-shadow(0 22px 34px rgba(0,0,0,.5))"></div>
<div id="sals" class="abs" style="left:590px;top:540px;width:330px;height:580px"><img src="__SAL_SHRUG__" style="width:100%;height:100%;object-fit:contain;object-position:right bottom;display:block;filter:drop-shadow(0 22px 34px rgba(0,0,0,.5))"></div>

<div id="end"><div class="abs" style="left:80px;right:80px;top:600px"><img class="logo" src="__LOGO__"><div class="t">Invent yours.</div>
  <div class="s">elixiary.com</div><div class="u">free &middot; ask Marlow anything</div><div class="u" style="margin-top:34px;color:rgba(252,254,253,.5)">@elixiary.ai</div></div>
  <div id="salend" class="abs" style="left:560px;top:1060px;width:560px;height:700px"><img src="__SAL_SHAKE__" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 24px 40px rgba(0,0,0,.55))"></div></div>

<div id="guides" class="guides"><i style="left:0;right:0;top:0;height:280px"></i><i style="left:0;right:0;bottom:0;height:500px"></i>
  <i style="right:0;top:280px;bottom:500px;width:200px"></i><i style="left:0;top:280px;bottom:500px;width:80px"></i><u></u></div>
<script>
const D=__DATA__;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)); const lerp=(a,b,u)=>a+(b-a)*u;
const E={out:u=>1-Math.pow(1-u,3),in:u=>u*u*u,io:u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2,
  soft:u=>1-Math.pow(1-u,4), back:u=>{const c=1.3;return 1+(c+1)*Math.pow(u-1,3)+c*Math.pow(u-1,2)}};
const seg=(t,t0,d,e=E.soft)=>e(clamp((t-t0)/d,0,1)); const $=id=>document.getElementById(id);
// every element enters by rising, sharpening and fading in -- and leaves the same way in reverse
const rise=(el,t0,d=.7,{y=36,s=.96,hold=99,dOut=.5}={})=>{const u=seg(t,t0,d),o=seg(t,t0+hold,dOut,E.in);
  el.style.opacity=u*(1-o); el.style.filter=`blur(${lerp(14,0,u)+o*10}px)`;
  el.style.transform=`translateY(${lerp(y,0,u)-o*24}px) scale(${lerp(s,1,u)})`};
const T=Object.assign({type0:.3,typeDur:2.0,think:2.7,reveal:4.5,name:5.1,build:9.2,next:13.6,end:16.4,total:18.5},__TIMING__);
$('name_l').textContent=D.name;
$('rows').innerHTML=D.ingredients.slice(0,4).map(s=>{s=s.replace(/\s*\(.*?\)/g,'');const m=s.match(/^([\d./]+\s*\w*)\s+(.*)$/);return `<div class="row"><b>${m?m[1]:''}</b><span>${m?m[2]:s}</span></div>`}).join('');
const rows=[...$('rows').children];
// long names shrink to fit the card rather than wrapping into the line beneath
(()=>{const el=$('name_l');let fs=150;el.style.fontSize=fs+'px';
  const lines=()=>Math.round(el.getBoundingClientRect().height/(fs*0.98));
  while((lines()>2||el.scrollWidth>920)&&fs>84){fs-=4;el.style.fontSize=fs+'px'}})();
let t=0;
// Frame 0 is the cover. Instagram and TikTok take the first frame when a video
// arrives through the API, and a black typing screen makes a black cover. So
// frame 0 renders the fully composed reveal for one frame — 33ms, seen as the
// cover, not as content — and the story starts on frame 1.
const COVER_AT = 6.2;
// the prompt arrives one word at a time, big; that is the hook
const WORDS = D.prompt.split(/\s+/);
$('words').innerHTML = WORDS.map(w=>`<span style="display:inline-block;margin-right:.24em">${w}</span>`).join('');
const wordEls = [...$('words').children];
window.render=function(time){ renderAt(time < 1/30 ? COVER_AT : time); };
function renderAt(time){t=time;
  const pre=t<T.reveal, rv=seg(t,T.reveal,.9);
  // photo: bloom in, slow push, parallax (bg drifts slower than hero)
  const push=1+0.07*clamp((t-T.reveal)/(T.end-T.reveal),0,1);
  const room=seg(t,T.build-.3,.9);            // build + ask phases: photo lifts out of the way
  const lift=lerp(0,-520,room), shrink=lerp(1,.5,room);
  $('hero').style.transform=`translate(${lerp(0,-250,room)}px,${lift}px) scale(${lerp(1.22,1,rv)*push*shrink})`;
  $('hero').style.filter=`brightness(${lerp(1.6,1,rv)}) blur(${lerp(10,0,rv)}px)`;
  $('hero').style.borderRadius = `${lerp(0,56,room)}px`;
  $('bg').style.transform=`translateY(${lift*0.3}px) scale(${1+0.02*clamp((t-T.reveal)/10,0,1)})`;
  $('hero').style.opacity=$('bg').style.opacity=$('vig').style.opacity=pre?0:Math.min(rv*2,1);
  $('hint').style.opacity=pre?seg(t,0,.8):1-seg(t,T.reveal,.5);
  rise($('wm'),T.reveal+.5,.8);
  rise($('handle'),T.reveal+.7,.8,{y:16});
  // ask phase: the prompt lands word by word at 122px
  rise($('ask'),.08,.6,{hold:T.reveal-.6-.08,dOut:.35});
  const per=T.typeDur/WORDS.length; let last=null;
  wordEls.forEach((el,i)=>{const u=seg(t,T.type0+i*per,.42,E.back);const o=seg(t,T.reveal-.35,.35,E.in);
    el.style.opacity=u*(1-o);el.style.filter=`blur(${lerp(16,0,u)}px)`;el.style.transform=`translateY(${lerp(40,0,u)}px) scale(${lerp(.9,1,u)})`;
    if(u>0)last=el});
  const wr=$('words').getBoundingClientRect();
  if(last){const r=last.getBoundingClientRect();const blink=t<T.type0+T.typeDur||Math.floor(t*2.2)%2===0;
    $('cur').style.left=(r.right+14)+'px';$('cur').style.top=(r.top+r.height*0.12)+'px';$('cur').style.opacity=pre&&blink?1-seg(t,T.reveal-.35,.35,E.in):0}
  else $('cur').style.opacity=0;
  rise($('think'),T.think,.6,{hold:T.reveal-T.think-.5,dOut:.35}); $('dots').textContent='.'.repeat(1+Math.floor((t*3)%3));
  rise($('sal'),T.think+.1,.8,{y:120,hold:T.reveal-T.think-.6,dOut:.35});
  $('bar').style.opacity=$('barglow').style.opacity=$('typed').style.opacity=0;
  // photo phase
  rise($('name'),T.name,.7,{y:60,s:.86,hold:T.build-T.name-.9,dOut:.55});
  rise($('salr'),T.reveal+.3,.8,{y:90,s:.8,hold:T.build-(T.reveal+.3)-.9,dOut:.5});
  rise($('salb'),T.build+.25,.9,{y:80,hold:T.next-T.build-1.0,dOut:.5});
  rise($('sals'),T.next+.25,.9,{y:80,hold:T.end-T.next-1.0,dOut:.5});
  rise($('build'),T.build,.9,{hold:T.next-T.build-.9,dOut:.55});
  rows.forEach((r,i)=>{const u=seg(t,T.build+.35+i*.32,.7);r.style.opacity=u;r.style.transform=`translateX(${lerp(-26,0,u)}px)`;r.style.filter=`blur(${lerp(8,0,u)}px)`});
  rise($('next'),T.next,.9,{hold:T.end-T.next-.9,dOut:.5});
  // marlow: skeptical while it's named, cheers on the ask
  $('m').style.opacity=0;
  const mar=(k,t0,hold)=>{$('m_img').src=D.marlow[k];const u=seg(t,t0,.8,E.back),o=seg(t,t0+hold,.45,E.in);
    $('m').style.opacity=Math.min(u*2,1)*(1-o);$('m').style.transform=`translateY(${lerp(60,0,u)}px) scale(${lerp(.6,1,u)}) rotate(${lerp(-10,0,u)}deg)`};

  // end
  const en=seg(t,T.end,.7); $('end').style.opacity=t>=T.end?en:0; $('end').style.transform=`scale(${lerp(1.03,1,en)})`;
  rise($('salend'),T.end+.4,.9,{y:90});
};
window.showGuides=v=>{$('guides').style.display=v?'block':'none'}; window.render(0);
</script></body></html>
